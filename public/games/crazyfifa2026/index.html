<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Crazy FIFA 2026 | Unity WebGL Game | The 14Lights</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050507;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #gameWrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #11111d 0%, #050507 100%);
      }
      #unityContainer {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
      }
      #unityContainer canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      /* Custom Loading Screen Overlay */
      #loadingOverlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(5, 5, 7, 0.96);
        backdrop-filter: blur(10px);
        transition: opacity 0.5s ease, visibility 0.5s ease;
        padding: 24px;
        text-align: center;
      }
      #loadingOverlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .logo-ring {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spinner-ring {
        position: absolute;
        inset: 0;
        border: 4px solid rgba(212, 175, 55, 0.15);
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .logo-icon {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-title {
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }
      .loading-subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 24px;
        max-width: 360px;
      }

      .progress-bar-container {
        width: 100%;
        max-width: 320px;
        height: 10px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 12px;
        position: relative;
      }
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #AA8C2C 0%, #D4AF37 50%, #FFF099 100%);
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.6);
        border-radius: 12px;
        transition: width 0.2s ease;
      }
      .progress-text {
        font-size: 12px;
        font-weight: 600;
        color: #D4AF37;
        letter-spacing: 0.5px;
      }

      /* Error Overlay */
      #errorOverlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #09090e;
        padding: 32px;
        text-align: center;
      }
      #errorOverlay.active {
        display: flex;
      }
      .error-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 16px;
      }
      .error-heading {
        font-size: 20px;
        font-weight: 700;
        color: #f87171;
        margin-bottom: 8px;
      }
      .error-desc {
        font-size: 14px;
        color: #9ca3af;
        max-width: 420px;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      .retry-btn {
        background: linear-gradient(90deg, #D4AF37 0%, #AA8C2C 100%);
        color: #050507;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .retry-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      }
    </style>
    <script src="Build/UnityLoader.js"></script>
  </head>
  <body>
    <div id="gameWrapper">
      <!-- Loading Screen -->
      <div id="loadingOverlay">
        <div class="logo-ring">
          <div class="spinner-ring"></div>
          <img src="/assets/VR_LOGO.webp" alt="The 14Lights" class="logo-icon" onerror="this.style.display='none'" />
        </div>
        <div class="loading-title">Crazy FIFA 2026</div>
        <div class="loading-subtitle" id="statusMessage">Downloading Unity WebGL engine & game assets...</div>
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">0%</div>
      </div>

      <!-- Error Screen -->
      <div id="errorOverlay">
        <div class="error-icon">!</div>
        <div class="error-heading">Unable to Load WebGL Game</div>
        <div class="error-desc" id="errorMessage">WebGL is required to play Crazy FIFA 2026. Please make sure hardware acceleration and WebGL are enabled in your browser settings.</div>
        <button class="retry-btn" onclick="location.reload()">Retry Loading</button>
      </div>

      <!-- Unity Game Container -->
      <div id="unityContainer"></div>
    </div>

    <script>
      (function() {
        var progressBar = document.getElementById('progressBar');
        var progressText = document.getElementById('progressText');
        var statusMessage = document.getElementById('statusMessage');
        var loadingOverlay = document.getElementById('loadingOverlay');
        var errorOverlay = document.getElementById('errorOverlay');
        var errorMessage = document.getElementById('errorMessage');

        function showError(msg) {
          loadingOverlay.classList.add('hidden');
          if (errorMessage && msg) {
            errorMessage.textContent = msg;
          }
          errorOverlay.classList.add('active');
        }

        // Check WebGL Support
        function checkWebGL() {
          try {
            var canvas = document.createElement('canvas');
            var gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            return !!gl;
          } catch (e) {
            return false;
          }
        }

        if (!checkWebGL()) {
          showError('Your browser or graphic card does not support WebGL. Please update your browser or enable hardware acceleration.');
          return;
        }

        window.addEventListener('DOMContentLoaded', function() {
          if (typeof UnityLoader === 'undefined') {
            showError('Failed to load UnityLoader script. Please check network connection and try again.');
            return;
          }

          try {
            var gameInstance = UnityLoader.instantiate("unityContainer", "Build/Build.json", {
              onProgress: function(gameInstance, progress) {
                if (!progressBar) return;
                var pct = Math.round(progress * 100);
                progressBar.style.width = pct + '%';
                progressText.textContent = pct + '%';

                if (progress < 0.3) {
                  statusMessage.textContent = 'Downloading WebGL engine files...';
                } else if (progress < 0.8) {
                  statusMessage.textContent = 'Loading stadium textures & 3D models...';
                } else if (progress < 1.0) {
                  statusMessage.textContent = 'Initializing match engine & audio...';
                } else {
                  statusMessage.textContent = 'Match Ready! Launching game...';
                  setTimeout(function() {
                    loadingOverlay.classList.add('hidden');
                  }, 400);
                }
              }
            });

            // Fallback timeout safety check
            setTimeout(function() {
              if (loadingOverlay && !loadingOverlay.classList.contains('hidden')) {
                // If loaded, hide overlay
                loadingOverlay.classList.add('hidden');
              }
            }, 15000);

          } catch (err) {
            console.error('Error instantiating Unity game:', err);
            showError('An error occurred while launching Unity WebGL: ' + (err.message || err));
          }
        });

        window.addEventListener('error', function(e) {
          console.warn('Game runtime notice:', e.message);
        });
      })();
    </script>
  </body>
</html>
